name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # jsdom tests: client-side hook behavior, edge cases
      - run: npm run test

      # Node-environment tests, no jsdom/window at all — catches module-scope
      # window/localStorage access before it ever reaches an actual SSR user.
      - run: npm run test:ssr

      - run: npm run build
      - run: npm run size
